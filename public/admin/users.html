<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin - Kelola user NexPlay.">
    <title>Kelola Users — Admin NexPlay</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon">🎮</div>
            <span>Nex<span class="text-gradient">Play</span></span>
        </a>
        <ul class="navbar-nav" id="navbar-nav"><li><a href="/" class="nav-link">🏠 Store</a></li></ul>
        <button class="mobile-toggle" id="mobile-toggle">☰</button>
        <div class="nav-actions" id="nav-actions"></div>
    </nav>

    <main class="main-content">
        <div class="admin-layout">
            <aside class="admin-sidebar">
                <div class="sidebar-title">Dashboard</div>
                <ul class="sidebar-nav">
                    <li><a href="/admin/dashboard.html" class="sidebar-link"><i data-lucide="bar-chart-2" style="width:18px;height:18px"></i> Overview</a></li>
                    <li><a href="/admin/products.html" class="sidebar-link"><i data-lucide="package" style="width:18px;height:18px"></i> Produk</a></li>
                    <li><a href="/admin/orders.html" class="sidebar-link"><i data-lucide="receipt" style="width:18px;height:18px"></i> Transaksi</a></li>
                    <li><a href="/admin/vouchers.html" class="sidebar-link"><i data-lucide="ticket" style="width:18px;height:18px"></i> Voucher Diskon</a></li>
                    <li><a href="/admin/revenue.html" class="sidebar-link"><i data-lucide="banknote" style="width:18px;height:18px"></i> Laporan Omset</a></li>
                    <li><a href="/admin/users.html" class="sidebar-link active"><i data-lucide="users" style="width:18px;height:18px"></i> Users</a></li>
                    <li><a href="/admin/chat.html" class="sidebar-link"><i data-lucide="message-square" style="width:18px;height:18px"></i> Live Chat</a></li>
                </ul>
                <div class="sidebar-title">Quick Links</div>
                <ul class="sidebar-nav">
                    <li><a href="/" class="sidebar-link"><i data-lucide="store" style="width:18px;height:18px"></i> Lihat Store</a></li>
                    <li><a href="#" class="sidebar-link" onclick="logout()"><i data-lucide="log-out" style="width:18px;height:18px"></i> Logout</a></li>
                </ul>
            </aside>

            <div class="admin-content">
                <h2 style="margin-bottom:8px"><i data-lucide="users" style="width:24px;height:24px;display:inline-block;vertical-align:middle;margin-right:8px;color:var(--accent-primary)"></i> Kelola <span class="text-gradient">Users</span></h2>
                <p style="color:var(--text-secondary);margin-bottom:32px">Daftar semua user yang terdaftar di NexPlay</p>

                <div class="glass-card" style="padding:0;overflow-x:auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Bergabung</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody">
                            <tr><td colspan="5" style="text-align:center;padding:32px"><div class="loading-spinner"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        async function loadUsers() {
            try {
                const data = await API.get('/api/users');
                renderUsers(data.users);
            } catch (err) {
                if (err.message.includes('Unauthorized') || err.message.includes('Forbidden')) {
                    window.location.href = '/login.html';
                    return;
                }
                showToast(err.message, 'error');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('users-tbody');

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted)">Belum ada user</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map(u => `
                <tr>
                    <td style="color:var(--text-muted)">#${u.id}</td>
                    <td>
                        <div style="display:flex;align-items:center;gap:10px">
                            <div style="width:36px;height:36px;border-radius:50%;background:${u.role === 'admin' ? '#18181b' : '#3f3f46'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:#ffffff">
                                ${u.username.charAt(0).toUpperCase()}
                            </div>
                            <span style="font-weight:600;color:var(--text-primary)">${u.username}</span>
                        </div>
                    </td>
                    <td style="color:var(--text-secondary)">${u.email}</td>
                    <td>
                        <span style="padding:4px 12px;border-radius:var(--radius-full);font-size:0.78rem;font-weight:600;${
                            u.role === 'admin'
                                ? 'background:#18181b;color:#ffffff;'
                                : 'background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border-medium);'
                        }">
                            ${u.role === 'admin' ? '👑 Admin' : '👤 User'}
                        </span>
                    </td>
                    <td style="font-size:0.85rem;color:var(--text-muted)">${new Date(u.created_at).toLocaleDateString('id-ID')}</td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (window.lucide) {
            lucide.createIcons();
            // Automatically update icons when DOM changes (for dynamic content)
            const observer = new MutationObserver((mutations) => {
                let shouldUpdate = false;
                for (let m of mutations) {
                    if (m.addedNodes.length > 0) {
                        shouldUpdate = true;
                        break;
                    }
                }
                if (shouldUpdate) {
                    lucide.createIcons();
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
        }
    </script>
</body>
</html>
