<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin - Kelola transaksi dan pesanan NexPlay.">
    <title>Kelola Transaksi — Admin NexPlay</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon">🎮</div>
            <span>Nex<span class="text-gradient">Play</span></span>
        </a>
        <ul class="navbar-nav" id="navbar-nav"><li><a href="/" class="nav-link">🏠 Store</a></li></ul>
        <button class="mobile-toggle" id="mobile-toggle">☰</button>
        <div class="nav-actions" id="nav-actions"></div>
    </nav>

    <main class="main-content">
        <div class="admin-layout">
            <aside class="admin-sidebar">
                <div class="sidebar-title">Dashboard</div>
                <ul class="sidebar-nav">
                    <li><a href="/admin/dashboard.html" class="sidebar-link">📊 Overview</a></li>
                    <li><a href="/admin/products.html" class="sidebar-link">📦 Produk</a></li>
                    <li><a href="/admin/orders.html" class="sidebar-link active">🧾 Transaksi</a></li>
                    <li><a href="/admin/users.html" class="sidebar-link">👥 Users</a></li>
                </ul>
                <div class="sidebar-title">Quick Links</div>
                <ul class="sidebar-nav">
                    <li><a href="/" class="sidebar-link">🏪 Lihat Store</a></li>
                    <li><a href="#" class="sidebar-link" onclick="logout()">🚪 Logout</a></li>
                </ul>
            </aside>

            <div class="admin-content">
                <h2 style="margin-bottom:8px">🧾 Kelola <span class="text-gradient">Transaksi</span></h2>
                <p style="color:var(--text-secondary);margin-bottom:32px">Monitor dan update status pesanan</p>

                <div class="glass-card" style="padding:0;overflow-x:auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Order Code</th>
                                <th>User</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Metode</th>
                                <th>Status</th>
                                <th>Tanggal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <tr><td colspan="8" style="text-align:center;padding:32px"><div class="loading-spinner"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        async function loadOrders() {
            try {
                const data = await API.get('/api/orders?all=1');
                renderOrders(data.orders);
            } catch (err) {
                if (err.message.includes('Unauthorized') || err.message.includes('Forbidden')) {
                    window.location.href = '/login.html';
                    return;
                }
                showToast(err.message, 'error');
            }
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('orders-tbody');

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--text-muted)">Belum ada transaksi</td></tr>`;
                return;
            }

            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td><span style="font-weight:700;color:var(--text-primary);font-family:var(--font-heading);font-size:0.85rem">${o.order_code}</span></td>
                    <td>${o.username || 'User #' + o.user_id}</td>
                    <td>${(o.items || []).length} item</td>
                    <td style="font-weight:600">${formatRupiah(o.total_amount)}</td>
                    <td>${o.payment_method || '-'}</td>
                    <td><span class="order-status status-${o.payment_status}">${o.payment_status}</span></td>
                    <td style="font-size:0.85rem;color:var(--text-muted)">${new Date(o.created_at).toLocaleDateString('id-ID')}</td>
                    <td>
                        <select class="form-control" style="width:auto;min-width:130px;font-size:0.8rem;padding:6px 10px"
                                onchange="updateStatus(${o.id}, this.value)" ${o.payment_status === 'success' ? '' : ''}>
                            <option value="pending" ${o.payment_status === 'pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="processing" ${o.payment_status === 'processing' ? 'selected' : ''}>🔄 Processing</option>
                            <option value="success" ${o.payment_status === 'success' ? 'selected' : ''}>✅ Success</option>
                            <option value="failed" ${o.payment_status === 'failed' ? 'selected' : ''}>❌ Failed</option>
                            <option value="refunded" ${o.payment_status === 'refunded' ? 'selected' : ''}>↩️ Refunded</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        async function updateStatus(orderId, status) {
            try {
                await API.put(`/api/orders/${orderId}/status`, { payment_status: status });
                showToast('Status pesanan diupdate! ✅', 'success');
                loadOrders();
            } catch (err) {
                showToast(err.message, 'error');
                loadOrders();
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
