<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daftar akun NexPlay dan mulai nikmati digital entertainment terlengkap.">
    <title>Register — NexPlay</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon"><i data-lucide="gamepad-2"></i></div>
            <span>Nex<span class="text-gradient">Play</span></span>
        </a>
        <ul class="navbar-nav" id="navbar-nav">
            <li><a href="/" class="nav-link"><i data-lucide="home" style="width:16px;height:16px;margin-bottom:-2px"></i> Home</a></li>
        </ul>
        <button class="mobile-toggle" id="mobile-toggle">☰</button>
        <div class="nav-actions" id="nav-actions">
            <a href="/login.html" class="btn btn-secondary btn-sm">Login</a>
            <a href="/register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-container">
            <div class="glass-card auth-card">
                <h2>Buat Akun Baru <i data-lucide="gamepad-2" style="display:inline-block;vertical-align:middle;color:var(--accent-primary)"></i></h2>
                <p class="auth-subtitle">Daftar dan mulai belanja digital entertainment</p>

                <form id="register-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Pilih username" required minlength="3" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="email@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Konfirmasi Password</label>
                        <input type="password" id="confirm-password" class="form-control" placeholder="Ulangi password" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>Daftar Sebagai</label>
                        <div class="role-selection" style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="radio" name="role" value="user" checked> User / Pembeli
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="radio" name="role" value="seller"> Seller / Penjual
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%" id="register-btn">
                        <i data-lucide="user-plus" style="display:inline-block;width:18px;height:18px;vertical-align:middle;margin-right:6px"></i> Daftar Sekarang
                    </button>
                </form>

                <div class="auth-footer">
                    Sudah punya akun? <a href="/login.html">Login di sini</a>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                showToast('Password tidak cocok!', 'error');
                return;
            }

            const btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" class="animate-spin" style="width:18px;height:18px;display:inline-block;vertical-align:middle;margin-right:6px"></i> Loading...';
            lucide.createIcons();

            try {
                const role = document.querySelector('input[name="role"]:checked').value;
                const data = await API.post('/api/auth/register', {
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    password: password,
                    role: role
                });

                showToast('Registrasi berhasil! 🎉', 'success');
                if (typeof CartStore !== 'undefined') CartStore.clear(); // Clear guest cart
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1500);
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="user-plus" style="display:inline-block;width:18px;height:18px;vertical-align:middle;margin-right:6px"></i> Daftar Sekarang';
                lucide.createIcons();
            }
        });
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
