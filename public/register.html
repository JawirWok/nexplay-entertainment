<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daftar akun NexPlay dan mulai nikmati digital entertainment terlengkap.">
    <title>Register — NexPlay</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon">🎮</div>
            <span>Nex<span class="text-gradient">Play</span></span>
        </a>
        <ul class="navbar-nav" id="navbar-nav">
            <li><a href="/" class="nav-link">🏠 Home</a></li>
        </ul>
        <button class="mobile-toggle" id="mobile-toggle">☰</button>
        <div class="nav-actions" id="nav-actions">
            <a href="/login.html" class="btn btn-secondary btn-sm">Login</a>
            <a href="/register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-container">
            <div class="glass-card auth-card">
                <h2>Buat Akun Baru 🎮</h2>
                <p class="auth-subtitle">Daftar dan mulai belanja digital entertainment</p>

                <form id="register-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Pilih username" required minlength="3" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="email@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Konfirmasi Password</label>
                        <input type="password" id="confirm-password" class="form-control" placeholder="Ulangi password" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%" id="register-btn">
                        🚀 Daftar Sekarang
                    </button>
                </form>

                <div class="auth-footer">
                    Sudah punya akun? <a href="/login.html">Login di sini</a>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                showToast('Password tidak cocok!', 'error');
                return;
            }

            const btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.textContent = 'Loading...';

            try {
                const data = await API.post('/api/auth/register', {
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    password: password
                });

                showToast('Registrasi berhasil! 🎉', 'success');
                setTimeout(() => {
                    window.location.href = '/';
                }, 800);
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.textContent = '🚀 Daftar Sekarang';
            }
        });
    </script>
</body>
</html>
