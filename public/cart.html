<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Keranjang belanja NexPlay. Review dan checkout produk digital kamu.">
    <title>Keranjang — NexPlay</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon">🎮</div>
            <span>Nex<span class="text-gradient">Play</span></span>
        </a>
        <ul class="navbar-nav" id="navbar-nav">
            <li><a href="/" class="nav-link">🏠 Home</a></li>
            <li><a href="/#catalog" class="nav-link">🎯 Katalog</a></li>
        </ul>
        <button class="mobile-toggle" id="mobile-toggle">☰</button>
        <div class="nav-actions" id="nav-actions"></div>
    </nav>

    <main class="main-content">
        <div class="container cart-page">
            <div class="page-header">
                <h1>🛒 Keranjang <span class="text-gradient">Belanja</span></h1>
                <p>Review item sebelum checkout</p>
            </div>

            <div id="cart-content">
                <div class="page-loading"><div class="loading-spinner"></div></div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        let cartItems = [];
        let cartTotal = 0;
        let selectedItemIds = new Set();

        async function loadCart() {
            // 1. Instantly load from client CartStore
            const localItems = CartStore.getItems();
            if (localItems.length > 0) {
                cartItems = localItems;
                cartItems.forEach(item => selectedItemIds.add(item.product_id || item.id));
                updateTotal();
                renderCart();
            }

            // 2. Fetch server cart
            try {
                const data = await API.get('/api/cart');
                const serverItems = data.items || [];

                if (serverItems.length > 0) {
                    // Merge server items with local items
                    const map = new Map();
                    localItems.forEach(i => map.set(parseInt(i.product_id || i.id, 10), i));
                    serverItems.forEach(s => {
                        const pid = parseInt(s.product_id || s.id, 10);
                        if (!map.has(pid)) {
                            map.set(pid, s);
                        } else {
                            map.get(pid).quantity = Math.max(map.get(pid).quantity, s.quantity);
                        }
                    });
                    cartItems = Array.from(map.values());
                    CartStore.saveItems(cartItems);
                } else if (localItems.length > 0) {
                    // Server has no items, sync local items to server
                    API.post('/api/cart/sync', { items: localItems }).catch(() => {});
                } else {
                    cartItems = [];
                }

                selectedItemIds.clear();
                cartItems.forEach(item => selectedItemIds.add(item.product_id || item.id));
                updateTotal();
                renderCart();
            } catch (err) {
                if (err.message && (err.message.includes('Unauthorized') || err.message.includes('login'))) {
                    if (cartItems.length === 0) {
                        document.getElementById('cart-content').innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">🔒</div>
                                <h3>Login diperlukan</h3>
                                <p>Silakan login untuk melihat keranjang belanja kamu</p>
                                <a href="/login.html" class="btn btn-primary">Login</a>
                            </div>
                        `;
                    }
                }
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-content');

            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🛒</div>
                        <h3>Keranjang kosong</h3>
                        <p>Belum ada item di keranjang. Yuk mulai belanja!</p>
                        <a href="/" class="btn btn-primary">Jelajahi Katalog</a>
                    </div>
                `;
                return;
            }

            const itemsHtml = cartItems.map(item => {
                const itemId = item.product_id || item.id;
                const isSelected = selectedItemIds.has(itemId) || selectedItemIds.has(item.id);
                return `
                <div class="glass-card cart-item" data-cart-id="${itemId}">
                    <div style="display:flex;align-items:center;padding:0 15px;">
                        <input type="checkbox" class="item-checkbox" data-id="${itemId}" ${isSelected ? 'checked' : ''} onchange="toggleItem(${itemId})" style="transform:scale(1.5);cursor:pointer;">
                    </div>
                    <div class="item-image">
                        ${item.image_url ? `<img src="${item.image_url}" alt="${item.name}" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';">` : ''}
                        <div class="placeholder-img" style="${item.image_url ? 'display:none;' : ''}font-size:1.5rem">${getCategoryIcon(item.category)}</div>
                    </div>
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <span class="item-category">${item.category || 'Digital'}</span>
                    </div>
                    <div class="item-quantity">
                        <button class="qty-btn" onclick="updateQty(${itemId}, ${(item.quantity || 1) - 1})">−</button>
                        <span class="qty-value">${item.quantity || 1}</span>
                        <button class="qty-btn" onclick="updateQty(${itemId}, ${(item.quantity || 1) + 1})">+</button>
                    </div>
                    <div class="item-price">
                        ${item.discount_percentage > 0 ? `<div style="font-size:0.8rem;text-decoration:line-through;color:var(--text-muted)">${formatRupiah(item.price * (item.quantity || 1))}</div>` : ''}
                        ${formatRupiah((item.actual_price || item.price) * (item.quantity || 1))}
                    </div>
                    <button class="item-remove" onclick="removeItem(${itemId})" title="Hapus">🗑️</button>
                </div>
            `}).join('');

            container.innerHTML = `
                <div class="cart-layout">
                    <div class="cart-items">${itemsHtml}</div>
                    <div class="glass-card cart-summary">
                        <h3>📋 Ringkasan</h3>
                        <div class="summary-row">
                            <span>Subtotal (${cartItems.length} item)</span>
                            <span>${formatRupiah(cartTotal)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Biaya Layanan</span>
                            <span style="color:var(--accent-green)">Gratis</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span>${formatRupiah(cartTotal)}</span>
                        </div>
                        <button class="btn btn-primary btn-lg" style="width:100%;margin-top:20px" onclick="proceedCheckout()">
                            💳 Checkout
                        </button>
                        <a href="/" class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;text-align:center">
                            ← Lanjut Belanja
                        </a>
                    </div>
                </div>
            `;
        }

        async function updateQty(itemId, newQty) {
            if (newQty <= 0) {
                await removeItem(itemId);
                return;
            }
            CartStore.updateQty(itemId, newQty);
            API.put(`/api/cart/${itemId}`, { quantity: newQty }).catch(() => {});
            cartItems = CartStore.getItems();
            updateTotal();
            renderCart();
        }

        async function removeItem(itemId) {
            CartStore.removeItem(itemId);
            API.delete(`/api/cart/${itemId}`).catch(() => {});
            selectedItemIds.delete(itemId);
            cartItems = CartStore.getItems();
            showToast('Item dihapus dari keranjang', 'info');
            updateTotal();
            renderCart();
        }

        function updateTotal() {
            cartTotal = cartItems
                .filter(item => selectedItemIds.has(item.product_id || item.id) || selectedItemIds.has(item.id))
                .reduce((sum, item) => sum + ((item.actual_price || item.price) * (item.quantity || 1)), 0);
        }

        function toggleItem(itemId) {
            if (selectedItemIds.has(itemId)) {
                selectedItemIds.delete(itemId);
            } else {
                selectedItemIds.add(itemId);
            }
            updateTotal();
            renderCart();
        }

        function proceedCheckout() {
            const selectedList = cartItems.filter(item => selectedItemIds.has(item.product_id || item.id) || selectedItemIds.has(item.id));
            if (selectedList.length === 0) {
                showToast('Pilih minimal satu item untuk checkout', 'warning');
                return;
            }
            sessionStorage.setItem('nexplay_checkout_data', JSON.stringify(selectedList));
            sessionStorage.setItem('nexplay_checkout_items', JSON.stringify(Array.from(selectedItemIds)));
            window.location.href = '/checkout.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            await loadCart();
        });
    </script>
</body>
</html>
