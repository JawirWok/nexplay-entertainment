<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="bgYt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    <radialGradient id="glowYt" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" fill="url(#bgYt)" />
  <rect width="800" height="533" fill="url(#glowYt)" />

  <!-- Card outline -->
  <rect x="40" y="40" width="720" height="453" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Top bar -->
  <g transform="translate(70, 75)">
    <rect width="90" height="28" rx="6" fill="#ff0000" fill-opacity="0.15" stroke="#ff0000" stroke-opacity="0.3" stroke-width="1" />
    <text x="45" y="18" fill="#ff4e45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">PREMIUM</text>
  </g>

  <!-- YouTube Music Icon -->
  <g transform="translate(70, 130)">
    <circle cx="38" cy="38" r="38" fill="#ff0000" />
    <circle cx="38" cy="38" r="28" fill="#ffffff" />
    <circle cx="38" cy="38" r="24" fill="#ff0000" />
    <path d="M33 27v22l17-11z" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="70" y="260" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">YouTube Music</text>
  <text x="70" y="295" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif" font-size="18" font-weight="500">1 Bulan Premium Individual • Tanpa Iklan</text>

  <!-- Features Pills -->
  <g transform="translate(70, 340)">
    <rect x="0" y="0" width="138" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="69" y="21" fill="#e4e4e7" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Ad-Free Music</text>

    <rect x="150" y="0" width="154" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="227" y="21" fill="#e4e4e7" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Background Play</text>

    <rect x="316" y="0" width="144" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="388" y="21" fill="#e4e4e7" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Offline Download</text>
  </g>

  <!-- Decorative Vinyl Graphic Right -->
  <g transform="translate(560, 160)" opacity="0.8">
    <circle cx="90" cy="90" r="90" fill="#18181b" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />
    <circle cx="90" cy="90" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
    <circle cx="90" cy="90" r="50" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
    <circle cx="90" cy="90" r="30" fill="#ff0000" />
    <circle cx="90" cy="90" r="8" fill="#ffffff" />
  </g>

  <!-- Bottom Brand Note -->
  <text x="70" y="445" fill="#71717a" font-family="sans-serif" font-size="13">Digital Subscription Code • Instant Activation</text>
</svg>
