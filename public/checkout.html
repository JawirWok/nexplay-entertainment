<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Checkout dan pembayaran produk digital di NexPlay.">
    <title>Checkout — NexPlay</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon"><i data-lucide="gamepad-2"></i></div>
            <span>Nex<span class="text-gradient">Play</span></span>
        </a>
        <ul class="navbar-nav" id="navbar-nav">
            <li><a href="/" class="nav-link"><i data-lucide="home" style="width:16px;height:16px;margin-bottom:-2px"></i> Home</a></li>
            <li><a href="/cart.html" class="nav-link"><i data-lucide="shopping-cart" style="width:32px;height:32px;display:inline-block;vertical-align:middle;margin-right:8px;color:var(--accent-primary)"></i> Keranjang</a></li>
        </ul>
        <button class="mobile-toggle" id="mobile-toggle">☰</button>
        <div class="nav-actions" id="nav-actions"></div>
    </nav>

    <main class="main-content">
        <div class="container checkout-page">
            <div class="page-header" style="text-align:center">
                <h1><i data-lucide="credit-card" style="width:32px;height:32px;display:inline-block;vertical-align:middle;margin-right:8px;color:var(--text-primary)"></i> <span class="text-gradient">Checkout</span></h1>
                <p>Pilih metode pembayaran untuk menyelesaikan pesanan</p>
            </div>

            <!-- Step indicators -->
            <div style="display:flex;justify-content:center;gap:8px;margin-bottom:40px">
                <div id="step-1" style="display:flex;align-items:center;gap:8px">
                    <span style="width:32px;height:32px;border-radius:50%;background:#18181b;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:0.85rem">1</span>
                    <span style="font-weight:600;font-size:0.9rem">Pembayaran</span>
                </div>
                <div style="width:40px;height:2px;background:var(--border-medium);align-self:center"></div>
                <div id="step-2" style="display:flex;align-items:center;gap:8px;opacity:0.4">
                    <span style="width:32px;height:32px;border-radius:50%;background:#ffffff;border:var(--border-medium);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem">2</span>
                    <span style="font-weight:600;font-size:0.9rem">Konfirmasi</span>
                </div>
                <div style="width:40px;height:2px;background:var(--border-medium);align-self:center"></div>
                <div id="step-3" style="display:flex;align-items:center;gap:8px;opacity:0.4">
                    <span style="width:32px;height:32px;border-radius:50%;background:#ffffff;border:var(--border-medium);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem">3</span>
                    <span style="font-weight:600;font-size:0.9rem">Selesai</span>
                </div>
            </div>

            <div id="checkout-content">
                <div class="page-loading"><div class="loading-spinner"></div></div>
            </div>
        </div>
    </main>

    <!-- Payment Processing Modal -->
    <div class="payment-modal" id="payment-modal">
        <div class="payment-modal-content" id="modal-content">
            <div class="payment-spinner"></div>
            <h3>Memproses Pembayaran...</h3>
            <p style="color:var(--text-secondary);margin-top:8px">Mohon tunggu sebentar</p>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let selectedMethod = null;
        let cartData = null;
        let currentOrder = null;
        let appliedVoucher = null;
        let savedMethods = [];

        async function loadCheckout() {
            try {
                // 1. Check sessionStorage nexplay_checkout_data
                let checkoutItems = null;
                const checkoutDataJson = sessionStorage.getItem('nexplay_checkout_data');
                if (checkoutDataJson) {
                    try {
                        checkoutItems = JSON.parse(checkoutDataJson);
                    } catch (e) { console.error('Error parsing nexplay_checkout_data', e); }
                }

                // 2. Fallback to CartStore in localStorage
                if (!checkoutItems || checkoutItems.length === 0) {
                    const localItems = (typeof CartStore !== 'undefined') ? CartStore.getItems() : [];
                    const selectedItemsJson = sessionStorage.getItem('nexplay_checkout_items');
                    if (selectedItemsJson) {
                        try {
                            const selectedItemIds = JSON.parse(selectedItemsJson);
                            if (Array.isArray(selectedItemIds) && selectedItemIds.length > 0) {
                                checkoutItems = localItems.filter(i => selectedItemIds.includes(i.id) || selectedItemIds.includes(i.product_id));
                            }
                        } catch (e) {}
                    }
                    if (!checkoutItems || checkoutItems.length === 0) {
                        checkoutItems = localItems;
                    }
                }

                // 3. Try to fetch from server or sync local items to server
                try {
                    const serverCart = await API.get('/api/cart');
                    if ((!checkoutItems || checkoutItems.length === 0) && serverCart && serverCart.items && serverCart.items.length > 0) {
                        const selectedItemsJson = sessionStorage.getItem('nexplay_checkout_items');
                        if (selectedItemsJson) {
                            try {
                                const selectedItemIds = JSON.parse(selectedItemsJson);
                                if (Array.isArray(selectedItemIds) && selectedItemIds.length > 0) {
                                    serverCart.items = serverCart.items.filter(i => selectedItemIds.includes(i.id));
                                }
                            } catch (e) {}
                        }
                        checkoutItems = serverCart.items;
                    } else if (checkoutItems && checkoutItems.length > 0) {
                        API.post('/api/cart/sync', { items: checkoutItems }).catch(() => {});
                    }
                } catch (apiErr) {
                    console.warn('API cart check note:', apiErr);
                }

                if (!checkoutItems || checkoutItems.length === 0) {
                    document.getElementById('checkout-content').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i data-lucide="shopping-cart" style="width:48px;height:48px;margin:auto"></i></div>
                            <h3>Keranjang kosong</h3>
                            <p>Tambahkan produk ke keranjang terlebih dahulu</p>
                            <a href="/" class="btn btn-primary">Jelajahi Katalog</a>
                        </div>
                    `;
                    return;
                }

                cartData = { items: checkoutItems };

                // Calculate subtotal
                cartData.subtotal = cartData.items.reduce((sum, i) => sum + ((i.actual_price || i.price) * i.quantity), 0);

                // Load payment methods
                const methodsData = await API.get('/api/payment/methods');
                savedMethods = methodsData.methods || [];
                renderPaymentStep(savedMethods);
            } catch (err) {
                if (err.message && err.message.includes('Unauthorized')) {
                    window.location.href = '/login.html';
                    return;
                }
                showToast(err.message || 'Gagal memuat checkout', 'error');
            }
        }

        function renderPaymentStep(methods) {
            cartData.subtotal = cartData.items.reduce((sum, i) => sum + ((i.actual_price || i.price) * i.quantity), 0);
            const discountAmount = appliedVoucher ? appliedVoucher.discount_amount : 0;
            cartData.finalTotal = Math.max(0, cartData.subtotal - discountAmount);

            // Group methods by type
            const ewallets = methods.filter(m => m.type === 'e-wallet');
            const banks = methods.filter(m => m.type === 'bank_transfer');
            const others = methods.filter(m => m.type === 'card' || m.type === 'qris');

            const container = document.getElementById('checkout-content');
            container.innerHTML = `
                <div class="glass-card" style="padding:28px;margin-bottom:24px">
                    <h3 style="margin-bottom:8px">📦 Ringkasan Pesanan</h3>
                    <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:16px">${cartData.items.length} item</p>
                    ${cartData.items.map(item => `
                        <div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:var(--border-light)">
                            ${item.image_url ? `<img src="${item.image_url}" alt="${item.name}" style="width:48px;height:48px;border-radius:6px;object-fit:cover;border:var(--border-light);flex-shrink:0" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">` : ''}
                            <span style="${item.image_url ? 'display:none;' : ''}font-size:1.3rem">${getCategoryIcon(item.category)}</span>
                            <div style="flex:1">
                                <div style="font-weight:600;font-size:0.92rem;color:var(--text-primary)">${item.name}</div>
                                <div style="font-size:0.8rem;color:var(--text-muted)">x${item.quantity}</div>
                            </div>
                            <div style="text-align:right">
                                ${item.discount_percentage > 0 ? `<div style="font-size:0.75rem;text-decoration:line-through;color:var(--text-muted)">${formatRupiah(item.price * item.quantity)}</div>` : ''}
                                <div style="font-weight:700;color:var(--text-primary);font-size:0.95rem">${formatRupiah((item.actual_price || item.price) * item.quantity)}</div>
                            </div>
                        </div>
                    `).join('')}

                    <!-- Voucher Section -->
                    <div style="margin-top:20px;padding:16px;background:var(--bg-tertiary);border-radius:var(--radius-md);border:var(--border-light)">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                            <span style="font-size:1.1rem">🎟️</span>
                            <span style="font-size:0.88rem;font-weight:700;color:var(--text-primary)">Voucher Promo / Diskon</span>
                        </div>
                        <div style="display:flex;gap:8px">
                            <input type="text" id="voucher-input" class="form-control" placeholder="Masukkan kode (cth: HEMAT10)" 
                                   style="text-transform:uppercase;font-weight:600" 
                                   ${appliedVoucher ? 'disabled' : ''} 
                                   value="${appliedVoucher ? appliedVoucher.code : ''}">
                            ${appliedVoucher ? 
                                `<button class="btn btn-secondary btn-sm" onclick="removeVoucher()" style="white-space:nowrap">✕ Hapus</button>` : 
                                `<button class="btn btn-primary btn-sm" onclick="applyVoucher()" style="white-space:nowrap">Gunakan</button>`
                            }
                        </div>
                        ${appliedVoucher ? `
                            <div style="margin-top:8px;font-size:0.85rem;color:var(--accent-green);font-weight:600;display:flex;align-items:center;gap:6px">
                                <span>✅ Voucher <strong>${appliedVoucher.code}</strong> aktif! Hemat ${formatRupiah(appliedVoucher.discount_amount)}</span>
                            </div>
                        ` : `
                            <div style="font-size:0.75rem;color:var(--text-muted);margin-top:6px">
                                Punya kode voucher promo? Masukkan untuk mendapatkan potongan harga.
                            </div>
                        `}
                    </div>

                    <div style="margin-top:16px;border-top:var(--border-light);padding-top:12px">
                        <div style="display:flex;justify-content:space-between;font-size:0.95rem;margin-bottom:6px">
                            <span style="color:var(--text-secondary)">Subtotal</span>
                            <span style="font-weight:600">${formatRupiah(cartData.subtotal)}</span>
                        </div>
                        ${appliedVoucher ? `
                            <div style="display:flex;justify-content:space-between;font-size:0.95rem;margin-bottom:6px;color:var(--accent-green)">
                                <span>Diskon Voucher (${appliedVoucher.code})</span>
                                <span style="font-weight:700">-${formatRupiah(appliedVoucher.discount_amount)}</span>
                            </div>
                        ` : ''}
                        <div style="display:flex;justify-content:space-between;padding-top:12px;margin-top:8px;font-size:1.25rem;font-weight:800;border-top:var(--border-medium)">
                            <span>Total Pembayaran</span>
                            <span style="color:var(--text-primary)">${formatRupiah(cartData.finalTotal)}</span>
                        </div>
                    </div>
                </div>

                <div class="glass-card" style="padding:28px;margin-bottom:24px">
                    <h3 style="margin-bottom:20px">💳 Pilih Metode Pembayaran</h3>

                    <h4 style="font-size:0.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">E-Wallet</h4>
                    <div class="payment-methods">
                        ${ewallets.map(m => `
                            <div class="glass-card payment-method ${selectedMethod === m.id ? 'selected' : ''}" data-method="${m.id}" onclick="selectMethod('${m.id}')">
                                <div class="method-icon" style="background:#fff;display:flex;align-items:center;justify-content:center;font-size:0.8rem;color:#000;text-align:center;">${m.icon.startsWith('http') ? `<img src="${m.icon}" alt="${m.name}" style="max-width:80%;max-height:80%;object-fit:contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"><span style="display:none;font-weight:bold">${m.name}</span>` : m.icon}</div>
                                <div class="method-info">
                                    <h4>${m.name}</h4>
                                    <p>${m.description}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <h4 style="font-size:0.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px">Bank Transfer</h4>
                    <div class="payment-methods">
                        ${banks.map(m => `
                            <div class="glass-card payment-method ${selectedMethod === m.id ? 'selected' : ''}" data-method="${m.id}" onclick="selectMethod('${m.id}')">
                                <div class="method-icon" style="background:#fff;display:flex;align-items:center;justify-content:center;font-size:0.8rem;color:#000;text-align:center;">${m.icon.startsWith('http') ? `<img src="${m.icon}" alt="${m.name}" style="max-width:80%;max-height:80%;object-fit:contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"><span style="display:none;font-weight:bold">${m.name}</span>` : m.icon}</div>
                                <div class="method-info">
                                    <h4>${m.name}</h4>
                                    <p>${m.description}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <h4 style="font-size:0.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px">Lainnya</h4>
                    <div class="payment-methods">
                        ${others.map(m => `
                            <div class="glass-card payment-method ${selectedMethod === m.id ? 'selected' : ''}" data-method="${m.id}" onclick="selectMethod('${m.id}')">
                                <div class="method-icon" style="background:#fff;display:flex;align-items:center;justify-content:center;font-size:0.8rem;color:#000;text-align:center;">${m.icon.startsWith('http') ? `<img src="${m.icon}" alt="${m.name}" style="max-width:80%;max-height:80%;object-fit:contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"><span style="display:none;font-weight:bold">${m.name}</span>` : m.icon}</div>
                                <div class="method-info">
                                    <h4>${m.name}</h4>
                                    <p>${m.description}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <button class="btn btn-primary btn-lg" style="width:100%" id="pay-btn" onclick="processPayment()" ${selectedMethod ? '' : 'disabled'}>
                    ${selectedMethod ? `💳 Bayar ${formatRupiah(cartData.finalTotal)}` : '<i data-lucide="lock" style="width:48px;height:48px;margin:auto"></i> Pilih Metode Pembayaran Dulu'}
                </button>
            `;
        }

        async function applyVoucher() {
            const input = document.getElementById('voucher-input');
            const code = input ? input.value.trim() : '';
            if (!code) {
                showToast('Masukkan kode voucher terlebih dahulu', 'warning');
                return;
            }
            try {
                const res = await API.post('/api/vouchers/apply', { code, total_amount: cartData.subtotal });
                appliedVoucher = res.voucher;
                showToast(res.message, 'success');
                renderPaymentStep(savedMethods);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function removeVoucher() {
            appliedVoucher = null;
            showToast('Voucher dibatalkan', 'info');
            renderPaymentStep(savedMethods);
        }

        function selectMethod(methodId) {
            selectedMethod = methodId;

            // Update UI
            document.querySelectorAll('.payment-method').forEach(el => {
                el.classList.toggle('selected', el.dataset.method === methodId);
            });

            const btn = document.getElementById('pay-btn');
            btn.disabled = false;
            btn.innerHTML = `💳 Bayar ${formatRupiah(cartData.finalTotal)}`;
        }

        async function processPayment() {
            if (!selectedMethod) return;

            const btn = document.getElementById('pay-btn');
            btn.disabled = true;

            // Show processing modal
            const modal = document.getElementById('payment-modal');
            modal.classList.add('show');

            try {
                // Get selected items
                let selectedItems = undefined;
                try {
                    selectedItems = JSON.parse(sessionStorage.getItem('nexplay_checkout_items'));
                } catch(e) {}

                // Step 1: Create order (checkout)
                const orderData = await API.post('/api/orders/checkout', {
                    payment_method: selectedMethod,
                    selected_items: selectedItems,
                    items: cartData ? cartData.items : undefined,
                    voucher_code: appliedVoucher ? appliedVoucher.code : ''
                });

                currentOrder = orderData.order;

                // Step 2: Process payment
                const paymentData = await API.post('/api/payment/process', {
                    order_id: currentOrder.id,
                    payment_method: selectedMethod
                });

                // Update step indicator
                document.getElementById('step-1').style.opacity = '0.4';
                document.getElementById('step-2').style.opacity = '1';
                document.getElementById('step-2').querySelector('span:first-child').style.background = '#18181b';
                document.getElementById('step-2').querySelector('span:first-child').style.color = '#fff';
                document.getElementById('step-2').querySelector('span:first-child').style.borderColor = '#18181b';

                // Show payment details
                setTimeout(() => {
                    modal.classList.remove('show');
                    renderPaymentDetails(paymentData);
                }, 1500);

            } catch (err) {
                modal.classList.remove('show');
                showToast(err.message, 'error');
                btn.disabled = false;
            }
        }

        function renderPaymentDetails(paymentData) {
            const container = document.getElementById('checkout-content');
            const details = paymentData.payment_details;

            let detailsHtml = '';

            if (details.type === 'virtual_account') {
                detailsHtml = `
                    <div class="va-details">
                        <div class="va-label">Bank</div>
                        <div style="font-weight:600;font-size:1.1rem;margin-bottom:12px">${details.bank}</div>
                        <div class="va-label">Nomor Virtual Account</div>
                        <div class="va-number">${details.va_number}</div>
                        <button class="btn-copy" onclick="copyToClipboard('${details.va_number}')">📋 Salin</button>
                        <div style="margin-top:12px;font-size:0.85rem;color:var(--text-muted)">
                            Berlaku sampai: ${new Date(details.expiry).toLocaleString('id-ID')}
                        </div>
                    </div>
                `;
            } else if (details.type === 'qris') {
                detailsHtml = `
                    <div class="va-details" style="text-align:center">
                        <div style="width:180px;height:180px;background:white;border-radius:12px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:3rem">
                            📱
                        </div>
                        <div class="va-label">QRIS Code (Demo)</div>
                        <div class="va-number" style="font-size:1rem">${details.qr_data}</div>
                        <div style="margin-top:8px;font-size:0.85rem;color:var(--text-muted)">
                            Scan dengan e-wallet manapun
                        </div>
                    </div>
                `;
            } else {
                detailsHtml = `
                    <div class="va-details">
                        <p style="color:var(--text-secondary)">${details.message}</p>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="glass-card" style="padding:32px;text-align:center">
                    <div style="font-size:3rem;margin-bottom:16px">⏳</div>
                    <h2>Menunggu Pembayaran</h2>
                    <p style="color:var(--text-secondary);margin-bottom:8px">Order: <span style="color:#18181b;font-weight:700;font-family:var(--font-heading)">${currentOrder.order_code}</span></p>
                    <p style="color:var(--text-secondary);margin-bottom:24px">Total: <span style="color:#18181b;font-weight:800;font-size:1.35rem">${formatRupiah(currentOrder.total_amount)}</span></p>

                    ${detailsHtml}

                    <div style="margin-top:24px;padding:16px;background:rgba(255,145,0,0.1);border:1px solid rgba(255,145,0,0.2);border-radius:var(--radius-md);text-align:left">
                        <div style="font-weight:600;color:var(--accent-orange);margin-bottom:4px">⚠️ Demo Mode</div>
                        <p style="font-size:0.85rem;color:var(--text-secondary)">Ini adalah demo payment gateway. Klik tombol "Konfirmasi Pembayaran" untuk simulasi pembayaran berhasil.</p>
                    </div>

                    <button class="btn btn-success btn-lg" style="width:100%;margin-top:24px" onclick="confirmPayment()">
                        ✅ Konfirmasi Pembayaran (Demo)
                    </button>
                </div>
            `;
        }

        async function confirmPayment() {
            const modal = document.getElementById('payment-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="payment-spinner"></div>
                <h3>Mengkonfirmasi Pembayaran...</h3>
                <p style="color:var(--text-secondary);margin-top:8px">Mohon tunggu sebentar</p>
            `;
            modal.classList.add('show');

            try {
                await API.post('/api/payment/confirm', { order_id: currentOrder.id });

                // Update steps
                document.getElementById('step-2').style.opacity = '0.4';
                document.getElementById('step-3').style.opacity = '1';
                document.getElementById('step-3').querySelector('span:first-child').style.background = '#15803d';
                document.getElementById('step-3').querySelector('span:first-child').style.color = '#fff';
                document.getElementById('step-3').querySelector('span:first-child').style.borderColor = '#15803d';

                setTimeout(() => {
                    modal.classList.remove('show');

                    document.getElementById('checkout-content').innerHTML = `
                        <div class="glass-card" style="padding:48px;text-align:center">
                            <div class="payment-success-icon">✅</div>
                            <h2 style="margin-bottom:8px">Pembayaran Berhasil! 🎉</h2>
                            <p style="color:var(--text-secondary);margin-bottom:24px">Terima kasih telah berbelanja di NexPlay</p>

                            <div style="background:#faf9f5;border:var(--border-medium);border-radius:var(--radius-md);padding:20px;margin-bottom:24px;text-align:left">
                                <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                                    <span style="color:var(--text-muted)">Order Code</span>
                                    <span style="font-weight:700;color:#18181b;font-family:var(--font-heading)">${currentOrder.order_code}</span>
                                </div>
                                <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                                    <span style="color:var(--text-muted)">Total</span>
                                    <span style="font-weight:700;color:var(--accent-green)">${formatRupiah(currentOrder.total_amount)}</span>
                                </div>
                                <div style="display:flex;justify-content:space-between">
                                    <span style="color:var(--text-muted)">Status</span>
                                    <span class="order-status status-success">SUCCESS</span>
                                </div>
                            </div>

                            <div style="display:flex;gap:12px;justify-content:center">
                                <a href="/orders.html" class="btn btn-primary">📦 Lihat Pesanan</a>
                                <a href="/" class="btn btn-secondary">🏠 Kembali ke Home</a>
                            </div>
                        </div>
                    `;

                    if (typeof CartStore !== 'undefined') {
                        if (cartData && cartData.items) {
                            cartData.items.forEach(item => {
                                CartStore.removeItem(item.id || item.product_id);
                            });
                        } else {
                            CartStore.clear();
                        }
                        AppState.cartCount = CartStore.getCount();
                    } else {
                        AppState.cartCount = 0;
                    }
                    sessionStorage.removeItem('nexplay_checkout_data');
                    sessionStorage.removeItem('nexplay_checkout_items');
                    updateCartBadge();
                }, 2000);

            } catch (err) {
                modal.classList.remove('show');
                showToast(err.message, 'error');
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Nomor disalin!', 'success');
            });
        }

        document.addEventListener('DOMContentLoaded', loadCheckout);
    </script>
</body>
</html>
